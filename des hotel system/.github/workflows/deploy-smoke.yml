name: Deploy smoke

# Runs deploy/install.sh end to end on a fresh runner whenever the
# self-host path changes, in both modes:
#   build  — the default; DezPMS_BUILD=1 with the PR's own DezPMS code baked in
#   pull   — DezPMS_PULL=1: prebuilt ghcr.io/DezPMS-pms/DezPMS, pinned, update
#            (logs in with GITHUB_TOKEN while the package is private, so
#            fork PRs can't pull it and this job fails for them)
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-smoke.yml"
  workflow_dispatch:

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

# least privilege: read the repo, and pull the image while the package is
# still private (a no-op once it is public)
permissions:
  contents: read
  packages: read

jobs:
  pull:
    name: install.sh (pull mode) end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_NAME: smoke.DezPMS.test
      ADMIN_EMAIL: ci@DezPMS.test
      ADMIN_PASSWORD: ci-smoke-password-1
      INSTALL_DIR: /opt/DezPMS
      # `latest` exercises the floating-tag -> vX.Y.Z pin (`stable` exists
      # from the first release after this workflow landed)
      DezPMS_TAG: latest
      DezPMS_PULL: "1"
      # prove the pull path; never silently fall back to a 45-min build
      DezPMS_PULL_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io (only matters while the package is private)
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        # sudo on hosted runners ignores -E; pass nothing privileged via env here —
        # the token rides stdin.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Hosted runners drop `sudo -E` ("preserving the entire environment is
      # not supported"), so forward every install var explicitly.
      - name: Install
        run: |
          sudo env \
            SITE_NAME="$SITE_NAME" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            INSTALL_DIR="$INSTALL_DIR" \
            DezPMS_TAG="$DezPMS_TAG" \
            DezPMS_PULL="$DezPMS_PULL" \
            DezPMS_PULL_FALLBACK="$DezPMS_PULL_FALLBACK" \
            bash deploy/install.sh

      - name: Pinned to a release
        run: |
          cat /opt/DezPMS/image.env
          grep -qx 'DezPMS_MODE=pull' /opt/DezPMS/image.env
          grep -qE '^DezPMS_PINNED=v[0-9]+\.[0-9]+\.[0-9]+$' /opt/DezPMS/image.env
          sudo grep -qE '^CUSTOM_TAG=v[0-9]' /opt/DezPMS/DezPMS.env

      - name: Site answers /DezPMS
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: ${SITE_NAME}" http://127.0.0.1:8080/DezPMS || true)
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "/DezPMS never returned 200 (last: $code)"; exit 1

      - name: Update (backup, pull, recreate, migrate)
        run: |
          # omit DezPMS_TAG so update keeps the pinned release from image.env
          sudo env \
            SITE_NAME="$SITE_NAME" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            INSTALL_DIR="$INSTALL_DIR" \
            DezPMS_PULL="$DezPMS_PULL" \
            DezPMS_PULL_FALLBACK="$DezPMS_PULL_FALLBACK" \
            /opt/DezPMS/install.sh update
          sudo docker compose -p DezPMS exec -T backend bash -c 'ls sites/*/private/backups/ | grep -q files'

      - name: Site still answers after update
        run: |
          curl -fsS -o /dev/null -H "Host: ${SITE_NAME}" http://127.0.0.1:8080/DezPMS

      - name: Logs on failure
        if: failure()
        run: sudo docker compose -p DezPMS logs --tail 200 || true

  install:
    name: install.sh (build mode) end to end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITE_NAME: smoke.DezPMS.test
      ADMIN_EMAIL: ci@DezPMS.test
      ADMIN_PASSWORD: ci-smoke-password-1
      INSTALL_DIR: /opt/DezPMS
      DezPMS_BUILD: "1"
      # Bake the PR's own DezPMS code into the image
      DezPMS_GIT_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}
      DezPMS_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install
        run: |
          sudo env \
            SITE_NAME="$SITE_NAME" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            INSTALL_DIR="$INSTALL_DIR" \
            DezPMS_BUILD="$DezPMS_BUILD" \
            DezPMS_GIT_URL="$DezPMS_GIT_URL" \
            DezPMS_BRANCH="$DezPMS_BRANCH" \
            bash deploy/install.sh

      - name: Site answers
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: ${SITE_NAME}" http://127.0.0.1:8080/api/method/ping || true)
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "ping never returned 200 (last: $code)"; exit 1

      - name: Re-run install is idempotent (keeps DB password)
        run: |
          sudo env \
            SITE_NAME="$SITE_NAME" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            INSTALL_DIR="$INSTALL_DIR" \
            DezPMS_BUILD="$DezPMS_BUILD" \
            DezPMS_GIT_URL="$DezPMS_GIT_URL" \
            DezPMS_BRANCH="$DezPMS_BRANCH" \
            bash deploy/install.sh

      - name: Update backs up, rebuilds and migrates
        run: |
          sudo env \
            SITE_NAME="$SITE_NAME" \
            ADMIN_EMAIL="$ADMIN_EMAIL" \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            INSTALL_DIR="$INSTALL_DIR" \
            DezPMS_BUILD="$DezPMS_BUILD" \
            DezPMS_GIT_URL="$DezPMS_GIT_URL" \
            DezPMS_BRANCH="$DezPMS_BRANCH" \
            /opt/DezPMS/install.sh update

      - name: Site still answers after update
        run: |
          curl -fsS -H "Host: ${SITE_NAME}" http://127.0.0.1:8080/api/method/ping

      - name: Logs on failure
        if: failure()
        run: sudo docker compose -p DezPMS logs --tail 200 || true
